<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="app-container">
      <div class="screen active" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test your knowledges with this fun questions</p>
        <button id="start-btn">Start Quiz</button>
      </div>

      <div class="screen" id="quiz-screen">
        <h2 class="quiz-question">Question goes here</h2>
        <div class="quiz-info">
          <p>
            Question <span class="current-question-span">0</span> of
            <span class="total-question">5</span>
          </p>
          <p>Score: <span class="score">0</span></p>
        </div>
        <div class="answers-container">
          <!-- Answers inserted here -->
        </div>

        <div class="progess-container">
          <div class="progress-bar"></div>
        </div>
      </div>

      <div class="screen" id="result-screen">
        <h2>Quiz Result</h2>
        <div class="result-info">
          <p>
            You scored <span class="final-score">0</span> out of
            <span class="total-question">5</span>
          </p>
          <p class="result-message">Greet</p>
        </div>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>
  </body>
</html>
